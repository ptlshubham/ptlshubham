<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How I build: full-stack architecture</title>
  <desc id="desc">An Angular and TypeScript frontend calls a Node.js and Express REST API over HTTP. The API uses JWT authentication and talks to MySQL or PostgreSQL through SQL and Prisma. The API integrates Razorpay for payments, Nodemailer for email and PDFKit for documents. Delivery runs Git workflow, code review, CI/CD, staging, then production on PM2, Hostinger and GoDaddy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#64748b"/>
    </marker>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="strip"><rect x="40" y="326" width="1120" height="60" rx="12"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .box  { fill: #111c33; stroke: #22304d; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #94a3b8; }
    .head { font-size: 21px; font-weight: 700; fill: #f1f5f9; }
    .line { font-size: 13.5px; fill: #94a3b8; }
    .lane { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .lanelabel { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #64748b; }
    .pkt { fill: #c7d2fe; }
    .fwd { animation: fwd 1.8s linear infinite; }
    .bwd { animation: bwd 1.8s linear infinite; }
    .lag { animation-delay: -0.9s; }
    @keyframes fwd { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(64px); opacity: 0; } }
    @keyframes bwd { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(-64px); opacity: 0; } }
    .wire { fill: none; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 6; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    .pill { fill: #111c33; stroke: #22304d; }
    .ptitle { font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .psub { font-size: 12.5px; fill: #94a3b8; }
    .stage { fill: #16223d; stroke: #2b3b5e; }
    .stext { font-size: 13.5px; font-weight: 600; fill: #e2e8f0; }
    .glide { animation: glide 4.5s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes glide { 0% { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateX(720px); opacity: 0; } }
    .live { transform-box: fill-box; transform-origin: center; animation: live 1.8s ease-out infinite; }
    @keyframes live { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }
    .in { opacity: 0; animation: rise 0.7s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; } .d4 { animation-delay: 0.75s; } .d5 { animation-delay: 1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .fwd, .bwd, .wire, .glide, .live, .in { animation: none; }
      .in { opacity: 1; }
      .glide, .live { opacity: 0; }
    }
  </style>

  <rect width="1200" height="420" rx="18" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="17.5" fill="none" stroke="#1e293b"/>

  <g class="sans">
    <!-- ── tier 1 · frontend ───────────────────────────── -->
    <g class="in d1">
      <rect class="box" x="40" y="40" width="320" height="150" rx="14"/>
      <circle cx="68" cy="72" r="5" fill="#e66767"/>
      <text class="kicker" x="82" y="76">FRONTEND</text>
      <text class="head" x="62" y="112">Angular · TypeScript</text>
      <text class="line" x="62" y="140">Reusable components · Responsive UI</text>
      <text class="line" x="62" y="164">HTML5 · CSS3 · Bootstrap</text>
    </g>

    <!-- ── tier 2 · backend ────────────────────────────── -->
    <g class="in d2">
      <rect class="box" x="440" y="40" width="320" height="150" rx="14"/>
      <circle cx="468" cy="72" r="5" fill="#199e70"/>
      <text class="kicker" x="482" y="76">BACKEND · API</text>
      <text class="head" x="462" y="112">Node.js · Express</text>
      <text class="line" x="462" y="140">REST APIs · JWT authentication</text>
      <text class="line" x="462" y="164">Business logic · Role-based access</text>
    </g>

    <!-- ── tier 3 · data ───────────────────────────────── -->
    <g class="in d3">
      <rect class="box" x="840" y="40" width="320" height="150" rx="14"/>
      <circle cx="868" cy="72" r="5" fill="#3987e5"/>
      <text class="kicker" x="882" y="76">DATA</text>
      <text class="head" x="862" y="112">MySQL · PostgreSQL</text>
      <text class="line" x="862" y="140">Schema design · SQL queries</text>
      <text class="line" x="862" y="164">Prisma ORM · Data management</text>
    </g>

    <!-- ── request / response lanes ────────────────────── -->
    <g>
      <text class="lanelabel" x="400" y="98" text-anchor="middle">HTTP</text>
      <line class="lane" x1="364" y1="110" x2="434" y2="110" marker-end="url(#arrow)"/>
      <line class="lane" x1="436" y1="134" x2="366" y2="134" marker-end="url(#arrow)"/>
      <circle class="pkt fwd"     cx="368" cy="110" r="3.5"/>
      <circle class="pkt fwd lag" cx="368" cy="110" r="3.5"/>
      <circle class="pkt bwd"     cx="432" cy="134" r="3.5"/>

      <text class="lanelabel" x="800" y="98" text-anchor="middle">SQL</text>
      <line class="lane" x1="764" y1="110" x2="834" y2="110" marker-end="url(#arrow)"/>
      <line class="lane" x1="836" y1="134" x2="766" y2="134" marker-end="url(#arrow)"/>
      <circle class="pkt fwd"     cx="768" cy="110" r="3.5"/>
      <circle class="pkt bwd"     cx="832" cy="134" r="3.5"/>
      <circle class="pkt bwd lag" cx="832" cy="134" r="3.5"/>
    </g>

    <!-- ── integrations ────────────────────────────────── -->
    <path class="wire" d="M600 190 V214 M360 214 H840 M360 214 V238 M600 214 V238 M840 214 V238"/>
    <g class="in d4" text-anchor="middle">
      <rect class="pill" x="255" y="238" width="210" height="54" rx="12"/>
      <text class="ptitle" x="360" y="261">Payments</text>
      <text class="psub"   x="360" y="280">Razorpay</text>

      <rect class="pill" x="495" y="238" width="210" height="54" rx="12"/>
      <text class="ptitle" x="600" y="261">Email</text>
      <text class="psub"   x="600" y="280">Nodemailer</text>

      <rect class="pill" x="735" y="238" width="210" height="54" rx="12"/>
      <text class="ptitle" x="840" y="261">Documents</text>
      <text class="psub"   x="840" y="280">PDFKit</text>
    </g>

    <!-- ── delivery strip ──────────────────────────────── -->
    <g class="in d5">
      <rect class="box" x="40" y="326" width="1120" height="60" rx="12"/>
      <text class="kicker" x="64" y="361">DELIVERY</text>
      <line x1="160" y1="356" x2="880" y2="356" stroke="#2b3b5e" stroke-width="2"/>
      <g clip-path="url(#strip)">
        <circle class="glide" cx="160" cy="356" r="26" fill="url(#spark)"/>
      </g>
      <g text-anchor="middle">
        <rect class="stage" x="160" y="340" width="120" height="32" rx="16"/><text class="stext" x="220" y="361">Git workflow</text>
        <rect class="stage" x="310" y="340" width="120" height="32" rx="16"/><text class="stext" x="370" y="361">Code review</text>
        <rect class="stage" x="460" y="340" width="120" height="32" rx="16"/><text class="stext" x="520" y="361">CI/CD</text>
        <rect class="stage" x="610" y="340" width="120" height="32" rx="16"/><text class="stext" x="670" y="361">Staging</text>
        <rect class="stage" x="760" y="340" width="120" height="32" rx="16"/><text class="stext" x="828" y="361">Production</text>
      </g>
      <circle class="live" cx="778" cy="356" r="4" fill="#0ca30c"/>
      <circle cx="778" cy="356" r="4" fill="#0ca30c"/>
      <text class="line" x="1136" y="361" text-anchor="end">PM2 · Hostinger · GoDaddy</text>
    </g>
  </g>
</svg>
