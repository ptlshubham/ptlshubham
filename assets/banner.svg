<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Shubham Patel — Product Management &amp; Development · Senior Full-Stack Developer</title>
  <desc id="desc">Animated banner with drifting color glows and waves. Shubham Patel, Product Management &amp; Development and Senior Full-Stack Developer, working with Angular, TypeScript, Node.js, MySQL on SaaS, CRM and ERP products. Based in Anand, Gujarat, India.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c7d2fe"/>
      <stop offset="0.75" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
    .blob { transform-box: fill-box; transform-origin: center; animation: drift 16s ease-in-out infinite alternate; }
    .b2 { animation-duration: 20s; animation-delay: -7s; }
    .b3 { animation-duration: 18s; animation-delay: -3s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(60px, 25px) scale(1.18); }
      100% { transform: translate(-40px, -15px) scale(0.92); }
    }
    .wave  { animation: slide 16s linear infinite; }
    .wave2 { animation-duration: 24s; }
    @keyframes slide { to { transform: translateX(-1200px); } }
    .in { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; } .d5 { animation-delay: 1.1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .float { animation: bob 6s ease-in-out infinite; }
    .float.f2 { animation-duration: 7.5s; animation-delay: -2s; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    .chip rect { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.16; }
    .chip text { font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    @media (prefers-reduced-motion: reduce) {
      .blob, .wave, .float, .in { animation: none; }
      .in { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- drifting glows -->
    <g filter="url(#glow)">
      <circle class="blob"    cx="170"  cy="70"  r="120" fill="#6366f1" opacity="0.55"/>
      <circle class="blob b2" cx="1040" cy="60"  r="130" fill="#22d3ee" opacity="0.35"/>
      <circle class="blob b3" cx="790"  cy="250" r="110" fill="#dd0031" opacity="0.28"/>
    </g>

    <!-- corner details -->
    <g class="mono in d1" font-size="15" fill="#94a3b8">
      <text x="40" y="44">&lt;ptlshubham /&gt;</text>
    </g>
    <g class="sans in d1" font-size="14" fill="#94a3b8">
      <path d="M1022 30.5c-4.4 0-8 3.5-8 7.9 0 5.6 8 13.6 8 13.6s8-8 8-13.6c0-4.4-3.6-7.9-8-7.9zm0 10.9a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#22d3ee"/>
      <text x="1038" y="45">Anand, Gujarat, India</text>
    </g>

    <!-- floating code glyphs -->
    <g class="mono" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.10">
      <text class="float"    x="96"   y="190">{ }</text>
      <text class="float f2" x="1052" y="196">&lt;/&gt;</text>
    </g>

    <!-- headline -->
    <g class="sans" text-anchor="middle">
      <text class="in d2" x="600" y="92" font-size="15" font-weight="600" letter-spacing="5" fill="#94a3b8">HI THERE, I'M</text>
      <text class="in d3" x="600" y="160" font-size="68" font-weight="800" fill="url(#name)">Shubham Patel</text>
      <text class="in d4" x="600" y="200" font-size="22" font-weight="500" fill="#cbd5e1">Product Management &amp; Development  ·  Senior Full-Stack Developer</text>
    </g>

    <!-- stack chips -->
    <g class="sans in d5">
      <g class="chip" transform="translate(291 222)">
        <rect width="100" height="30" rx="15"/><circle cx="17" cy="15" r="4.5" fill="#dd0031"/><text x="29" y="20">Angular</text>
      </g>
      <g class="chip" transform="translate(403 222)">
        <rect width="120" height="30" rx="15"/><circle cx="17" cy="15" r="4.5" fill="#3178c6"/><text x="29" y="20">TypeScript</text>
      </g>
      <g class="chip" transform="translate(535 222)">
        <rect width="100" height="30" rx="15"/><circle cx="17" cy="15" r="4.5" fill="#5fa04e"/><text x="29" y="20">Node.js</text>
      </g>
      <g class="chip" transform="translate(647 222)">
        <rect width="90" height="30" rx="15"/><circle cx="17" cy="15" r="4.5" fill="#4479a1"/><text x="29" y="20">MySQL</text>
      </g>
      <g class="chip" transform="translate(749 222)">
        <rect width="160" height="30" rx="15"/><circle cx="17" cy="15" r="4.5" fill="#22d3ee"/><text x="29" y="20">SaaS · CRM · ERP</text>
      </g>
    </g>

    <!-- waves: each path is 2400px wide with a 600px period, so a -1200px slide loops seamlessly -->
    <path class="wave2" fill="url(#waveA)" opacity="0.18"
      d="M0 282 Q150 300 300 282 T600 282 T900 282 T1200 282 T1500 282 T1800 282 T2100 282 T2400 282 V300 H0 Z"/>
    <path class="wave" fill="url(#waveA)" opacity="0.32"
      d="M0 288 Q150 272 300 288 T600 288 T900 288 T1200 288 T1500 288 T1800 288 T2100 288 T2400 288 V300 H0 Z"/>
  </g>
</svg>
