<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-labelledby="title desc">
  <title id="title">Skills and expertise</title>
  <desc id="desc">01 Product Management &amp; Strategy: Product Planning, Requirement Analysis, Feature Planning, Product Lifecycle Management, Business Requirement Understanding, Task Prioritization, Sprint Planning, Delivery Coordination, Release Planning, Stakeholder Communication. 02 Project &amp; Team Management: Team Leadership, Task Allocation, Team Coordination, Development Planning, Code Review Management, Progress Tracking, Project Execution, Problem Solving, Developer Mentoring. 03 Frontend Development: Angular, Angular Standalone, TypeScript, JavaScript, HTML5, CSS3, SCSS, Bootstrap 5, ng-bootstrap, ng-select, CKEditor 5, ApexCharts, FullCalendar, Swiper. 04 Backend &amp; Database: Node.js, Express.js, REST APIs, PHP, MySQL 8, PostgreSQL, SQL, Prisma, JWT Authentication, Database Design, Query Optimization. 05 DevOps &amp; Infrastructure: Git, GitHub, GitLab, CI/CD, PM2, Linux VPS, Hostinger, GoDaddy, Server Management, Staging &amp; Production, Deployment Management. 06 Integrations &amp; Services: Razorpay, Firebase, Google reCAPTCHA, Facebook SDK, Nodemailer, PHPMailer, PDFKit, SMTP Integration, Payment Gateway Integration, Third-party APIs.</desc>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .panel { fill: #0f172a; stroke: #1e293b; }
    .num { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #94a3b8; }
    .title { font-size: 19px; font-weight: 700; fill: #f1f5f9; }
    .chip rect { fill: #16223d; stroke: #2b3b5e; }
    .chip text { font-size: 14px; font-weight: 500; fill: #e2e8f0; }
    .in { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .chip.in { animation-name: pop; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } }
  </style>
