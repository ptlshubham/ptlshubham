    <circle class="ring" cx="906" cy="128" r="46" fill="none" stroke="#9085e9" stroke-width="6" stroke-linecap="round" transform="rotate(-90 906 128)"/>
    <g class="in" style="animation-delay:.3s">
      <text class="big" x="906" y="139">0</text>
      <text class="label" x="906" y="204">Current streak</text>
      <text class="sub" x="906" y="226">No active streak</text>
    </g>
    <g class="in" style="animation-delay:.45s">
